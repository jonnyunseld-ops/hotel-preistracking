<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel-Preistracking</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --ink: #1d1d1f;
    --muted: #77777c;
    --faint: #a9a9ae;
    --green: #248a52;
    --green-bg: rgba(52,199,89,.14);
    --red: #c93a34;
    --red-bg: rgba(255,59,48,.12);
    --glass: rgba(255,255,255,.58);
    --glass-strong: rgba(255,255,255,.72);
    --hairline: rgba(255,255,255,.75);
    --shadow: 0 1px 1px rgba(20,20,30,.03), 0 8px 24px rgba(20,20,30,.07), 0 24px 60px rgba(20,20,30,.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: clamp(24px,4vw,52px) clamp(16px,3vw,32px) 80px;
    background: #f2f2f6;
    background-image:
      radial-gradient(900px 600px at 12% -8%, rgba(140,170,255,.22), transparent 60%),
      radial-gradient(800px 560px at 95% 5%, rgba(255,180,120,.18), transparent 60%),
      radial-gradient(900px 700px at 50% 110%, rgba(150,220,180,.16), transparent 60%);
    background-attachment: fixed;
  }
  .shell { max-width: 1060px; margin: 0 auto; }

  header { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:12px; margin-bottom:24px; padding:0 6px; }
  h1 { font-size: clamp(24px,3vw,32px); font-weight:700; letter-spacing:-.02em; }
  header p { color: var(--muted); font-size:13.5px; margin-top:5px; }

  /* Tabs — Segmented Glass */
  .tabs {
    display:inline-flex; gap:4px; padding:5px; margin-bottom:22px;
    background: rgba(120,120,128,.12);
    border-radius: 100px;
    backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4);
    flex-wrap:wrap;
  }
  .tab {
    border:0; background:transparent; color:var(--muted);
    padding:9px 20px; border-radius:100px; font-size:14px; font-weight:590;
    cursor:pointer; transition: all .25s cubic-bezier(.2,.6,.2,1); font-family:inherit;
  }
  .tab:hover { color: var(--ink); }
  .tab.active {
    background: var(--glass-strong); color: var(--ink);
    box-shadow: inset 0 0 0 .5px var(--hairline), 0 2px 8px rgba(20,20,30,.10);
  }

  .card {
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(1.6); -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border-radius: 26px;
    box-shadow: inset 0 0 0 .5px var(--hairline), var(--shadow);
    padding: clamp(20px,2.6vw,30px);
    margin-bottom: 18px;
    position: relative; overflow: hidden;
  }
  .card::before { /* Glanzkante oben */
    content:""; position:absolute; top:0; left:8%; right:8%; height:1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.95), transparent);
  }

  .ziel-head { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .ziel-head h2 { font-size:20px; font-weight:680; letter-spacing:-.01em; }
  .ziel-head span { color:var(--muted); font-size:13px; }

  /* Hotel-Karten */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px; margin-bottom:22px; }
  .stat {
    background: var(--glass-strong);
    border-radius: 18px; padding: 0 0 15px;
    box-shadow: inset 0 0 0 .5px var(--hairline), 0 1px 4px rgba(20,20,30,.05);
    display:flex; flex-direction:column; gap:7px; min-width:0; overflow:hidden;
  }
  .stat .foto { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; }
  .stat .body { padding: 12px 18px 0; display:flex; flex-direction:column; gap:7px; min-width:0; }
  .stat .hrow { display:flex; align-items:center; gap:8px; min-width:0; }
  .stat .dot { width:9px; height:9px; border-radius:99px; flex-shrink:0; }
  .stat .hname { font-size:13.5px; font-weight:620; letter-spacing:-.005em; line-height:1.3; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stat .preis { font-size:26px; font-weight:700; letter-spacing:-.025em; white-space:nowrap; font-variant-numeric:tabular-nums; line-height:1.1; }
  .stat .preis .dash { color: var(--faint); font-weight:600; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chip {
    display:inline-flex; align-items:center; gap:4px; white-space:nowrap;
    font-size:11.5px; font-weight:620; padding:3.5px 10px; border-radius:100px;
    background: rgba(120,120,128,.12); color: var(--muted);
  }
  .chip.down { background: var(--green-bg); color: var(--green); }
  .chip.up { background: var(--red-bg); color: var(--red); }
  .stat .sub { font-size:11.5px; color:var(--faint); line-height:1.45; }

  .chart-wrap { position:relative; height:330px; margin-top:4px; }

  h3 { font-size:15px; font-weight:650; margin-bottom:14px; letter-spacing:-.01em; }
  .twrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:13px; min-width:760px; }
  th { text-align:left; color:var(--faint); font-weight:560; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;
       padding:8px 12px; border-bottom:1px solid rgba(60,60,67,.10); white-space:nowrap; }
  td { padding:11px 12px; border-bottom:1px solid rgba(60,60,67,.07); vertical-align:top; }
  tr:last-child td { border-bottom:none; }
  tbody tr { transition: background .15s; }
  tbody tr:hover { background: rgba(255,255,255,.5); }
  td.num { font-variant-numeric:tabular-nums; font-weight:650; white-space:nowrap; }
  td.datum { white-space:nowrap; color:var(--muted); font-variant-numeric:tabular-nums; }
  td.hotel { font-weight:590; white-space:nowrap; }
  td.notiz { color:var(--muted); font-size:12px; line-height:1.5; min-width:220px; }
  td.quelle { color:var(--muted); font-size:12.5px; white-space:nowrap; }
  .pill { display:inline-block; padding:3px 10px; border-radius:100px; font-size:11px; font-weight:600;
          background:rgba(120,120,128,.12); color:var(--muted); white-space:nowrap; }
  td.link { white-space:nowrap; }
  a.angebot { display:inline-flex; align-items:center; gap:4px; text-decoration:none;
              font-size:11.5px; font-weight:620; padding:3.5px 10px; border-radius:100px;
              background:rgba(90,130,255,.14); color:#3a5bc7; transition:background .15s; }
  a.angebot:hover { background:rgba(90,130,255,.24); }
  .pill.gruen { background:var(--green-bg); color:var(--green); }
  .empty { color:var(--muted); text-align:center; padding:40px 0; font-size:14px; }

  /* ---- Verlauf als aufklappbare Zeilen (eine pro Hotel) ---- */
  .acc { display:flex; flex-direction:column; }
  .acc-item { border-bottom:1px solid rgba(60,60,67,.08); }
  .acc-item:last-child { border-bottom:none; }
  .acc-head {
    display:flex; align-items:center; gap:12px; width:100%;
    padding:13px 6px; background:none; border:none; cursor:pointer;
    text-align:left; font:inherit; color:inherit; border-radius:12px;
    transition:background .15s;
  }
  .acc-head:hover { background:rgba(120,120,128,.07); }
  .acc-dot { width:9px; height:9px; border-radius:50%; flex:0 0 auto; }
  .acc-name { font-weight:600; font-size:13.5px; flex:1 1 auto; min-width:0;
              overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acc-preis { font-variant-numeric:tabular-nums; font-weight:660; font-size:14px; white-space:nowrap; }
  .acc-meta { font-size:11.5px; color:var(--faint); white-space:nowrap; }
  .acc-chev { flex:0 0 auto; color:var(--faint); font-size:15px; line-height:1;
              transition:transform .2s ease; transform:rotate(0deg); }
  .acc-item.open .acc-chev { transform:rotate(90deg); }
  .acc-body { display:none; padding:2px 6px 14px; }
  .acc-item.open .acc-body { display:block; }
  .hist { display:flex; flex-direction:column; gap:2px; }
  .hrowline {
    display:grid; grid-template-columns:64px 92px auto 1fr auto; align-items:center;
    gap:10px; padding:8px 10px; border-radius:10px; font-size:12.5px;
  }
  .hrowline:nth-child(odd) { background:rgba(120,120,128,.05); }
  .hrowline .hd { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hrowline .hp { font-variant-numeric:tabular-nums; font-weight:640; white-space:nowrap; }
  .hrowline .hq { color:var(--faint); font-size:11.5px; overflow:hidden;
                  text-overflow:ellipsis; white-space:nowrap; }
  .hnote { grid-column:1 / -1; color:var(--muted); font-size:11.5px; line-height:1.55;
           padding-top:6px; white-space:normal; }
  @media (max-width:700px) {
    .hrowline { grid-template-columns:58px 84px auto; }
    .hrowline .hq { grid-column:1 / -1; }
  }
</style>

  /* Dark Mode, damit es nachts auf dem iPhone nicht blendet */
  @media (prefers-color-scheme: dark) {

      --red: #ff6b61;  --red-bg: rgba(255,59,48,.18);

<body>
<div class="shell">
<header>
  <div>
    <h1>Hotel-Preistracking</h1>
    <p id="meta"></p>
  </div>
</header>
<div class="tabs" id="tabs"></div>
<div class="card">
  <div class="ziel-head"><h2 id="zielLabel"></h2><span id="zielSub"></span></div>
  <div class="stats" id="stats"></div>
  <div class="chart-wrap"><canvas id="chart"></canvas></div>
</div>
<div class="card">
  <h3>Verlauf <span style="color:var(--faint); font-weight:500">— pro Hotel, zum Aufklappen antippen</span></h3>
  <div id="tableWrap"></div>
</div>
</div>

<script src="preistracking-daten.js?v=20260831185259"></script>
<script>
const CFG = window.PRICE_CONFIG.ziele;
const ENTRIES = window.PRICE_ENTRIES.slice();
const PALETTE = ["#1d1d1f", "#b0895b", "#5b7fb0", "#6aa084", "#a05b7f", "#8a8a8e"];
const fmt = v => v == null ? "–" : v.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
const fmt0 = v => v == null ? "–" : Math.round(v).toLocaleString("de-DE") + " €";
const dShort = d => { const [y,m,t] = d.split("-"); return t + "." + m + "." + y.slice(2); };

let active = Object.keys(CFG)[0];
let chart = null;
// Welche Hotel-Zeilen im Verlauf gerade aufgeklappt sind (überlebt Re-Render)
const wasOpen = new Set();

document.getElementById("meta").textContent =
  ENTRIES.length + " Datenpunkte · letzter Eintrag: " + dShort(ENTRIES.map(e => e.d).sort().at(-1));

function renderTabs() {
  const el = document.getElementById("tabs");
  el.innerHTML = "";
  for (const id of Object.keys(CFG)) {
    const b = document.createElement("button");
    b.className = "tab" + (id === active ? " active" : "");
    b.textContent = CFG[id].label;
    b.onclick = () => { active = id; render(); };
    el.appendChild(b);
  }
}

function render() {
  renderTabs();
  const cfg = CFG[active];
  document.getElementById("zielLabel").textContent = cfg.label;
  document.getElementById("zielSub").textContent = cfg.untertitel || "";

  const rows = ENTRIES.filter(e => e.ziel === active).sort((a, b) => a.d.localeCompare(b.d));
  const hotels = [...new Set([...Object.keys(cfg.hotels || {}), ...rows.map(r => r.hotel)])];
  const dates = [...new Set(rows.map(r => r.d))].sort();

  // Hotel-Karten
  const stats = document.getElementById("stats");
  stats.innerHTML = "";
  hotels.forEach((h, i) => {
    const serie = rows.filter(r => r.hotel === h && r.preis != null);
    const last = serie.at(-1), prev = serie.at(-2);
    const ref = cfg.hotels?.[h]?.referenz ?? null;
    const refLabel = cfg.hotels?.[h]?.referenzLabel || "Referenz";

    const chips = [];
    if (last && prev) {
      const d = last.preis - prev.preis;
      if (d === 0) chips.push('<span class="chip">±&nbsp;0&nbsp;€</span>');
      else if (d < 0) chips.push('<span class="chip down">▼ ' + fmt0(Math.abs(d)) + '</span>');
      else chips.push('<span class="chip up">▲ ' + fmt0(d) + '</span>');
    }
    if (ref != null && last && last.preis < ref) {
      chips.push('<span class="chip down">' + fmt0(ref - last.preis) + ' unter Buchung</span>');
    }

    const subParts = [];
    if (ref != null) subParts.push(refLabel + ": " + fmt(ref)); else subParts.push(refLabel);
    if (last) subParts.push("Stand " + dShort(last.d));

    const bild = cfg.hotels?.[h]?.bild;
    const div = document.createElement("div");
    div.className = "stat";
    div.innerHTML =
      (bild ? '<img class="foto" src="' + bild + '" alt="' + h + '" loading="lazy" onerror="this.remove()">' : "") +
      '<div class="body">' +
      '<div class="hrow"><span class="dot" style="background:' + PALETTE[i % PALETTE.length] + '"></span>' +
      '<span class="hname" title="' + h + '">' + h + '</span></div>' +
      '<div class="preis">' + (last ? fmt(last.preis) : '<span class="dash">–</span>') + '</div>' +
      (chips.length ? '<div class="chips">' + chips.join("") + '</div>' : "") +
      '<div class="sub">' + subParts.join(" · ") + '</div>' +
      '</div>';
    stats.appendChild(div);
  });

  // Chart — weiche Linien, Verläufe, ruhige Achsen
  const ctx = document.getElementById("chart").getContext("2d");
  const mkGradient = (hex) => {
    const g = ctx.createLinearGradient(0, 0, 0, 330);
    g.addColorStop(0, hex + "2e"); g.addColorStop(1, hex + "00");
    return g;
  };
  const datasets = hotels.map((h, i) => {
    const col = PALETTE[i % PALETTE.length];
    return {
      label: h,
      data: dates.map(d => {
        const hit = rows.filter(r => r.hotel === h && r.d === d && r.preis != null).at(-1);
        return hit ? hit.preis : null;
      }),
      borderColor: col,
      backgroundColor: mkGradient(col),
      fill: true,
      spanGaps: true, tension: .38, borderWidth: 2.5,
      pointRadius: 5, pointHoverRadius: 7,
      pointBackgroundColor: "#fff", pointBorderColor: col, pointBorderWidth: 2.5,
      clip: 12
    };
  });
  hotels.forEach((h, i) => {
    const ref = cfg.hotels?.[h]?.referenz;
    if (ref != null) {
      datasets.push({
        label: h + " · gebucht",
        data: dates.map(() => ref),
        borderColor: PALETTE[i % PALETTE.length] + "80",
        borderDash: [5, 6], borderWidth: 1.5, pointRadius: 0, tension: 0, fill: false, clip: 12
      });
    }
  });

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type: "line",
    data: { labels: dates.map(dShort), datasets },
    options: {
      maintainAspectRatio: false,
      layout: { padding: { top: 10, right: 14 } },
      interaction: { mode: "nearest", intersect: false },
      // Klick auf einen Punkt öffnet das hinterlegte Angebot
      onClick: (evt, els) => {
        if (!els.length) return;
        const { datasetIndex, index } = els[0];
        if (datasetIndex >= hotels.length) return;   // gestrichelte Referenzlinie
        const treffer = rows.filter(
          r => r.hotel === hotels[datasetIndex] && r.d === dates[index] && r.link
        ).at(-1);
        if (treffer) window.open(treffer.link, "_blank", "noopener,noreferrer");
      },
      onHover: (evt, els) => {
        const klickbar = els.some(e => {
          if (e.datasetIndex >= hotels.length) return false;
          return rows.some(
            r => r.hotel === hotels[e.datasetIndex] && r.d === dates[e.index] && r.link
          );
        });
        evt.native.target.style.cursor = klickbar ? "pointer" : "default";
      },
      plugins: {
        legend: {
          labels: {
            usePointStyle: true, pointStyle: "circle", boxWidth: 7, boxHeight: 7,
            padding: 16, font: { size: 12, weight: 500 }, color: "#77777c",
            filter: item => !item.text.includes("· gebucht")
          }
        },
        tooltip: {
          backgroundColor: "rgba(29,29,31,.92)", cornerRadius: 12, padding: 12,
          titleFont: { size: 12, weight: 600 }, bodyFont: { size: 12.5 },
          boxPadding: 5, usePointStyle: true,
          callbacks: {
            label: c => " " + c.dataset.label + ": " + fmt(c.parsed.y),
            afterLabel: c => {
              if (c.datasetIndex >= hotels.length) return "";
              const t = rows.filter(
                r => r.hotel === hotels[c.datasetIndex] && r.d === dates[c.dataIndex] && r.link
              ).at(-1);
              return t ? " Klicken → Angebot öffnen" : "";
            }
          }
        }
      },
      scales: {
        y: {
          border: { display: false },
          grace: "12%",
          ticks: { callback: v => fmt0(v), color: "#a9a9ae", font: { size: 11.5 }, maxTicksLimit: 6, padding: 8 },
          grid: { color: "rgba(60,60,67,.08)", drawTicks: false }
        },
        x: {
          border: { display: false },
          ticks: { color: "#a9a9ae", font: { size: 11.5 }, padding: 6 },
          grid: { display: false }
        }
      }
    }
  });

  // Verlauf — eine aufklappbare Zeile pro Hotel
  const wrap = document.getElementById("tableWrap");
  if (!rows.length) { wrap.innerHTML = '<div class="empty">Noch keine Einträge für dieses Ziel.</div>'; return; }

  const esc = s => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  let html = '<div class="acc">';
  hotels.forEach((h, i) => {
    const hist = rows.filter(r => r.hotel === h);
    if (!hist.length) return;
    const col = PALETTE[i % PALETTE.length];
    const letzter = hist.at(-1);
    const mitPreis = hist.filter(r => r.preis != null);
    const jung = mitPreis.at(-1);
    const offen = wasOpen.has(h);

    html +=
      '<div class="acc-item' + (offen ? " open" : "") + '" data-hotel="' + esc(h) + '">' +
        '<button class="acc-head" type="button" aria-expanded="' + (offen ? "true" : "false") + '">' +
          '<span class="acc-dot" style="background:' + col + '"></span>' +
          '<span class="acc-name">' + esc(h) + '</span>' +
          '<span class="acc-preis">' + (jung ? fmt(jung.preis) : "–") + '</span>' +
          '<span class="acc-meta">' + hist.length + ' Läufe · ' + dShort(letzter.d) + '</span>' +
          '<span class="acc-chev">›</span>' +
        '</button>' +
        '<div class="acc-body"><div class="hist">';

    for (const r of hist.slice().reverse()) {
      const pillClass = r.rate === "stornierbar" ? "pill gruen" : "pill";
      const linkCell = r.link
        ? '<a class="angebot" href="' + esc(r.link) + '" target="_blank" rel="noopener noreferrer">Angebot ↗</a>'
        : '<span style="color:var(--faint);font-size:11.5px">–</span>';
      html +=
        '<div class="hrowline">' +
          '<span class="hd">' + dShort(r.d) + '</span>' +
          '<span class="hp">' + fmt(r.preis) + '</span>' +
          '<span><span class="' + pillClass + '">' + esc(r.rate || "–") + '</span></span>' +
          '<span class="hq" title="' + esc(r.quelle) + '">' + esc(r.quelle || "–") + '</span>' +
          linkCell +
          (r.notiz ? '<span class="hnote">' + esc(r.notiz) + '</span>' : "") +
        '</div>';
    }
    html += '</div></div></div>';
  });
  wrap.innerHTML = html + '</div>';

  // Auf-/Zuklappen; gemerkt wird der Zustand über wasOpen, damit ein
  // Re-Render (Tabwechsel) nichts zurücksetzt.
  wrap.querySelectorAll(".acc-head").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = btn.closest(".acc-item");
      const name = item.dataset.hotel;
      const jetztOffen = !item.classList.contains("open");
      item.classList.toggle("open", jetztOffen);
      btn.setAttribute("aria-expanded", jetztOffen ? "true" : "false");
      if (jetztOffen) wasOpen.add(name); else wasOpen.delete(name);
    });
  });
}
render();
</script>
